[package]
name = "allowit-custom-policy"
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Test fixture only: compile `src/catching_policy.rs` instead of `policy/policy.rs`, so tests run
# a policy that catches rule failures in the deployed Wasm. Never deploy this build.
test-catching = []

[dependencies]
soroban-sdk = { workspace = true }
allowit-wallet-protocol = { path = "../protocol" }
allowit = { path = "../allowit" }
allowit-policy-wallet = { path = "../policy-wallet" }

[build-dependencies]
sha2 = "=0.10.9"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "=2.2.0"
