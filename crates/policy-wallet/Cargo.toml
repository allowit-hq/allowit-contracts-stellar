[package]
name = "allowit-policy-wallet"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[lib]
crate-type = ["rlib"]

[dependencies]
# `hazmat-address` gives `Address::to_payload`, which tells accounts from contracts.
soroban-sdk = { workspace = true, features = ["hazmat-address"] }
allowit-wallet-protocol = { path = "../protocol" }
allowit = { path = "../allowit" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "=2.2.0"
allowit-sep56-test-vault = { path = "../test-vault" }
