[package]
name = "allowit-stellar-policy"
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "MIT"
publish = false
description = "Stellar native bindings for the shared Allowit policy rules"

[lib]
name = "allowit"
crate-type = ["rlib"]

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[build-dependencies]
allowit-core.workspace = true

