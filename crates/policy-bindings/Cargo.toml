[package]
name = "allowit-stellar-policy-bindings"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/allowit-hq/allowit-contracts-stellar"
description = "Server policy bindings and canonical Stellar network inventory"

[workspace]

[features]
horizon-price = ["dep:allowit-core", "dep:time", "dep:url"]

[dependencies]
allowit-core = { git = "https://github.com/allowit-hq/allowit-core.git", tag = "v0.4.0", version = "0.4", default-features = false, features = ["transport"], optional = true }
stellar-strkey = "0.0.13"
time = { version = "0.3.55", features = ["parsing"], optional = true }
url = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
ed25519-dalek = "2"
sha2 = "0.10"
