[package]
name = "allowit-stellar-policy-bindings"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/allowit-hq/allowit-contracts-stellar"
description = "Server policy bindings and canonical Stellar network inventory"

[workspace]

[features]
horizon-price = ["dep:reqwest", "dep:stellar-strkey", "dep:time"]

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
stellar-strkey = { version = "0.0.13", optional = true }
time = { version = "0.3.55", features = ["parsing"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
