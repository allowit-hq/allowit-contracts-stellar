[workspace]
members = ["crates/policy", "crates/protocol", "contracts/allowit-wallet-engine", "contracts/allowit-engine-parent", "crates/policy-wallet", "contracts/allowit-simple-policy-engine", "contracts/allowit-common-policy-engine", "contracts/allowit-custom-policy", "crates/test-vault"]
resolver = "2"

# Every package in this repository, including crates/allowit-stellar and npm/stellar, releases at this version.
[workspace.package]
version = "0.4.0"
edition = "2024"
repository = "https://github.com/allowit-hq/allowit-contracts-stellar"

[workspace.dependencies]
soroban-sdk = "=28.0.0"
allowit = { package = "allowit-stellar-policy", path = "crates/policy", version = "0.4" }
allowit-core = { git = "https://github.com/allowit-hq/allowit-core.git", rev = "93e7a551c1ad28309163d03b0ff283d630f1e03f", version = "0.6", default-features = false, features = ["std"] }

# Every Allowit workspace uses this profile block, so a shared target directory
# builds each shared crate once. Release builds keep overflow checks, which the
# portable policy library requires, and the Soroban contract settings; the Wasm
# targets abort on panic by default.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
strip = "symbols"
