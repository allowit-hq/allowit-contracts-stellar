name: Validate contracts
on:
  push:
    branches: [main, prod]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stellar-unit-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        flow: [approval, limits]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Test portable policy behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-policy-bindings.py
          rustfmt --edition 2024 --check scripts/policy-smoke.rs scripts/policy-vectors.rs
          allowit_src=$(python3 scripts/core_sources.py --portable-lib)
          rustc --edition=2024 -Coverflow-checks=on --crate-type=rlib --crate-name=allowit --cfg 'feature="std"' "$allowit_src" -o "$RUNNER_TEMP/liballowit.rlib"
          rustc --edition=2024 -Coverflow-checks=on --test --extern allowit="$RUNNER_TEMP/liballowit.rlib" scripts/policy-smoke.rs -o "$RUNNER_TEMP/policy-smoke"
          "$RUNNER_TEMP/policy-smoke" "${{ matrix.flow }}" --nocapture | tee "$RUNNER_TEMP/policy.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/policy.log"
  contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: stellar-contracts
      - name: Check shared policy identity and formatting
        run: |
          python3 scripts/check-policy-bindings.py
          cargo fmt --all --check
          rustfmt --edition 2024 --check scripts/policy-smoke.rs scripts/policy-vectors.rs
      - name: Install pinned Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/stellar.tar.gz
          echo 'c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  /tmp/stellar.tar.gz' | sha256sum -c -
          mkdir /tmp/stellar-cli
          tar -xzf /tmp/stellar.tar.gz -C /tmp/stellar-cli
          echo /tmp/stellar-cli >> "$GITHUB_PATH"
          rustup target add wasm32v1-none --toolchain 1.98.0
      - name: Build all contract Wasm
        run: scripts/build-contracts.sh
      - name: Local authorization and custody regressions
        run: cargo test --workspace --locked
