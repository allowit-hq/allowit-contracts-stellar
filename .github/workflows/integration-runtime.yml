name: Stellar runtime smoke
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run the full integration regression suite
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: stellar-runtime-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: stellar-integration-runtime
      - name: Check shared policy identity and formatting
        run: |
          python3 scripts/check-policy-bindings.py
          cargo fmt --all --check
      - name: Install pinned Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/stellar.tar.gz
          echo 'c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  /tmp/stellar.tar.gz' | sha256sum -c -
          mkdir /tmp/stellar-cli
          tar -xzf /tmp/stellar.tar.gz -C /tmp/stellar-cli
          echo /tmp/stellar-cli >> "$GITHUB_PATH"
          rustup target add wasm32v1-none --toolchain 1.98.0
      - name: Build all contract Wasm
        run: scripts/build-contracts.sh
      - name: Policy wallets and shared-engine containment
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p allowit-policy-wallet -p allowit-simple-policy-engine -p allowit-common-policy-engine -p allowit-custom-policy -p allowit-engine-parent -p allowit-wallet-engine -- --nocapture 2>&1 | tee "$RUNNER_TEMP/wallet-mvp.log"
          grep -E "[1-9][0-9]* passed; 0 failed" "$RUNNER_TEMP/wallet-mvp.log"
      - name: Admin transaction tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/wallet-admin"
          "$RUNNER_TEMP/wallet-admin/bin/pip" install -r scripts/requirements-admin.txt
          "$RUNNER_TEMP/wallet-admin/bin/python" -m unittest discover -s scripts/tests -v
      - name: Full Stellar runtime regressions
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        run: cargo test --workspace --locked
