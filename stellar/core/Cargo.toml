[package]
name = "allowit-stellar-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Canonical Stellar wallet preparation, native authorization and settlement"

[workspace]

[dependencies]
allowit = { path = "../../crates/allowit", default-features = false, features = ["std"] }
allowit-policy-sdk = { package = "allowit-sdk", git = "https://github.com/allowit-hq/allowit-sdk.git", rev = "67f5d696847992e18131f815ce905713ec3646e1", default-features = false, features = ["std", "typed-workflow", "compiler"] }
base64 = "0.22"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
stellar-strkey = "0.0.13"
stellar-xdr = { version = "=28.0.0", features = ["std", "base64"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "native-tls-vendored"] }

[profile.dev]
debug = 0
