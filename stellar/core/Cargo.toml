[package]
name = "allowit-stellar-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/allowit-hq/allowit-contracts-stellar"
description = "Canonical Stellar wallet preparation, native authorization and settlement"

[workspace]

[dependencies]
allowit = { path = "../../crates/allowit", version = "0.1.0", default-features = false, features = ["std"] }
allowit-policy-sdk = { package = "allowit-sdk", git = "https://github.com/allowit-hq/allowit-core.git", tag = "v0.1.0", version = "0.1", default-features = false, features = ["std", "typed-workflow", "compiler"] }
base64 = "0.22"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
stellar-strkey = "0.0.13"
stellar-xdr = { version = "=28.0.0", features = ["std", "base64"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "native-tls-vendored"] }

# Every Allowit workspace uses this profile block, so a shared target directory
# builds each shared crate once. Release builds keep overflow checks, which the
# portable policy library requires, and the Soroban contract settings; the Wasm
# targets abort on panic by default.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
strip = "symbols"
